<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texto Diario</title>

  <style>
    :root{
      --bg:#f6f0e6;
      --text:#111;
      --muted:#3a3a3a;
      --line:rgba(0,0,0,.18);
      --border:rgba(0,0,0,.45);
    }
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Times New Roman", Georgia, serif;
      display:grid;
      place-items:center;
    }
    .card{
      width:min(760px,92vw);
      padding:28px 26px;
      text-align:center;
      animation:fadeIn .5s ease;
    }
    .date{
      font-size:14px;
      color:var(--muted);
      margin-bottom:14px;
      text-transform:capitalize;
    }
    .divider{
      height:1px;
      width:min(420px,80%);
      margin:16px auto 18px;
      background:linear-gradient(to right, transparent, var(--line), transparent);
    }
    .verse{
      font-size:16px;
      line-height:1.55;
      margin:0 0 16px 0;
    }
    .btn{
      background:transparent;
      border:1px solid var(--border);
      padding:10px 14px;
      font-family:inherit;
      font-size:14px;
      cursor:pointer;
      transition:background .25s ease, color .25s ease, transform .25s ease;
    }
    .btn:hover{
      background:#111;
      color:#fff;
      transform:translateY(-1px);
    }
    .expanded{
      max-height:0;
      opacity:0;
      overflow:hidden;
      transform:translateY(-6px);
      transition:max-height 420ms ease, opacity 420ms ease, transform 420ms ease;
      margin-top:14px;
      text-align:left;
    }
    .expanded.is-open{
      max-height:5000px;
      opacity:1;
      transform:translateY(0);
    }
    .body{
      line-height:1.7;
      font-size:16px;
      margin:0;
      white-space:pre-wrap;
    }
    @keyframes fadeIn{
      from{opacity:0}
      to{opacity:1}
    }
  </style>
</head>

<body>
  <main class="card">
    <div id="date" class="date"></div>
    <div class="divider"></div>

    <p id="verse" class="verse"></p>

    <button id="toggle" class="btn" type="button">Leer más</button>

    <section id="expanded" class="expanded" aria-hidden="true">
      <p id="body" class="body"></p>
    </section>
  </main>

    function pad2(n){ return String(n).padStart(2,"0"); }
    function todayKeyLocal(){
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }

    function render(){
      const now = new Date();
      document.getElementById("date").textContent = new Intl.DateTimeFormat("es-ES",{
        weekday:"long", day:"numeric", month:"long", year:"numeric"
      }).format(now);

      const key = todayKeyLocal();
      const entry = texts[key];

      // reset expand state on day change
      expanded.classList.remove("is-open");
      expanded.setAttribute("aria-hidden","true");
      toggleBtn.textContent = "Leer más";

      if(!entry){
        document.getElementById("verse").textContent = "Texto no disponible todavía.";
        document.getElementById("body").textContent = `No hay contenido guardado para: ${key}`;
        return;
      }
      document.getElementById("verse").textContent = entry.verse;
      document.getElementById("body").textContent = entry.body;
    }

    function scheduleMidnightRefresh(){
      const now = new Date();
      const next = new Date(now);
      next.setHours(24,0,2,0); // 00:00:02
      const ms = next - now;
      setTimeout(() => { render(); scheduleMidnightRefresh(); }, ms);
    }

    const toggleBtn = document.getElementById("toggle");
    const expanded = document.getElementById("expanded");

    toggleBtn.addEventListener("click", () => {
      const open = expanded.classList.toggle("is-open");
      expanded.setAttribute("aria-hidden", open ? "false" : "true");
      toggleBtn.textContent = open ? "Cerrar" : "Leer más";
    });

    render();
    scheduleMidnightRefresh();
  </script>
